<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Encontraste una mascota? — Huella SOS</title>
<style>
  :root {
    --primary: #0D2B4E;
    --secondary: #F4A261;
    --coral: #FF6F61;
    --cream: #FAF3E7;
    --card: #FFFBF4;
    --text: #2A2A2A;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: var(--cream);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 24px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(13, 43, 78, 0.08);
    padding: 20px;
    margin-bottom: 16px;
  }
  .pet-photo {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 12px;
    background: #f0e6d2;
  }
  .pet-name {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    color: var(--primary);
    margin: 0;
  }
  .pet-species {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin: 4px 0 0;
  }
  .copy {
    text-align: center;
    color: #555;
    font-size: 14px;
    margin: 12px 0;
  }
  button.primary, a.primary {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--coral);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 4px 12px rgba(255, 111, 97, 0.3);
    margin-bottom: 8px;
  }
  button.secondary {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--primary);
    border-radius: 14px;
    background: transparent;
    color: var(--primary);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 12px;
  }
  .status { padding: 12px; border-radius: 12px; font-size: 13px; margin-bottom: 12px; }
  .status.ok { background: #e8f5e9; color: #2e7d32; }
  .status.err { background: #ffebee; color: #c62828; }
  .loader { text-align: center; padding: 60px 16px; color: #888; }
  .footer {
    text-align: center;
    padding: 16px;
    color: #888;
    font-size: 12px;
  }
  .small { font-size: 12px; color: #888; text-align: center; }
  .badge {
    display: inline-block;
    background: var(--secondary);
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <h1>🐾 Huella SOS</h1>
  <p style="margin:4px 0 0;font-size:13px;opacity:0.85">Sistema de reencuentro</p>
</header>

<main id="root">
  <div class="loader">Buscando información…</div>
</main>

<div class="footer">
  Hecho con cariño desde Huella SOS · <a href="index.html" style="color:#0D2B4E">Sobre nosotros</a>
</div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ⚠️ Reemplazar antes de habilitar:
const SUPABASE_URL  = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON = 'YOUR_ANON_KEY';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const root = document.getElementById('root');

// ── Util: leer ?code= o el último segmento del path
function getCode() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('code')) return p.get('code');
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[parts.length - 1] || null;
}

// ── Util: pintar el HTML del card según el estado
function render(html) { root.innerHTML = html; }

function notFoundView() {
  render(`
    <div class="card">
      <h2 style="margin-top:0;text-align:center;color:var(--coral)">Código no reconocido</h2>
      <p class="copy">Verifica que escaneaste correctamente la chapita o vuelve a intentarlo.</p>
    </div>
  `);
}

function unclaimedView(code) {
  render(`
    <div class="card">
      <h2 style="margin-top:0;text-align:center">¡Bienvenido!</h2>
      <p class="copy">Esta chapita aún no está activada. Si es tuya, abre la app de <strong>Huella SOS</strong> e ingresa este código en <em>Mis mascotas → Activar chapita</em>:</p>
      <div style="text-align:center;font-size:22px;font-weight:800;color:var(--primary);background:#fff;padding:12px;border-radius:12px;letter-spacing:2px;margin:16px 0">${code}</div>
      <p class="small">¿No tienes la app? Descárgala en Google Play o App Store.</p>
    </div>
  `);
}

function petView(code, pet) {
  render(`
    <div class="card">
      ${pet.pet_photo
        ? `<img class="pet-photo" src="${pet.pet_photo}" alt="${pet.pet_name}">`
        : `<div class="pet-photo" style="display:flex;align-items:center;justify-content:center;font-size:60px;">🐾</div>`}
      <h2 class="pet-name">${pet.pet_name || 'Mascota'}</h2>
      <p class="pet-species">${(pet.pet_species || '').replace(/\b\w/g, c => c.toUpperCase())}</p>
      <p class="copy">Si encontraste a ${pet.pet_name || 'esta mascota'}, ayúdanos a avisar a su familia. Tu ubicación les permitirá llegar a recogerla.</p>
      <button class="primary" id="btnFound">📍 Encontré esta mascota</button>
      <p class="small">No mostramos los datos del dueño aquí por seguridad. La app le avisa al instante.</p>
    </div>

    <div class="card" id="formCard" style="display:none">
      <h3 style="margin-top:0">Cuéntale al dueño</h3>
      <div id="locStatus" class="status">Pidiendo tu ubicación…</div>
      <textarea id="msg" rows="3" placeholder="Mensaje opcional (estado de la mascota, lugar...)"></textarea>
      <button class="primary" id="btnSubmit">Enviar aviso al dueño</button>
      <button class="secondary" id="btnCancel">Cancelar</button>
    </div>

    <div class="card" id="okCard" style="display:none">
      <h3 style="margin-top:0;color:#2e7d32">¡Listo! 🐾</h3>
      <p>El dueño recibió la notificación con tu ubicación. Te enviará un mensaje pronto.</p>
      <p class="small">Gracias por ayudar a una familia a reencontrar a su peludito.</p>
    </div>
  `);

  let coords = null;

  document.getElementById('btnFound').onclick = () => {
    document.getElementById('formCard').style.display = 'block';
    if (!navigator.geolocation) {
      document.getElementById('locStatus').textContent = 'Tu navegador no soporta ubicación. Igual puedes enviar un mensaje.';
      document.getElementById('locStatus').className = 'status err';
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById('locStatus').textContent = '✅ Ubicación capturada. Solo se enviará al dueño.';
        document.getElementById('locStatus').className = 'status ok';
      },
      err => {
        document.getElementById('locStatus').textContent = '⚠️ No se pudo obtener tu ubicación. El aviso se enviará igualmente.';
        document.getElementById('locStatus').className = 'status err';
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  document.getElementById('btnCancel').onclick = () => {
    document.getElementById('formCard').style.display = 'none';
  };

  document.getElementById('btnSubmit').onclick = async () => {
    const msg = document.getElementById('msg').value.trim();
    const payload = {
      tag_code: code,
      latitude: coords?.lat || null,
      longitude: coords?.lng || null,
      finder_message: msg || null,
    };
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    const { error } = await sb.from('lost_pet_sightings').insert(payload);
    if (error) {
      btn.disabled = false;
      btn.textContent = 'Enviar aviso al dueño';
      alert('No se pudo enviar el aviso: ' + error.message);
      return;
    }
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('okCard').style.display = 'block';
  };
}

// ── Main: lookup del código
async function main() {
  const code = getCode();
  if (!code) { notFoundView(); return; }

  const { data, error } = await sb.rpc('fn_lookup_qr_tag', { p_code: code });
  if (error) {
    render(`<div class="card"><p class="status err">Error: ${error.message}</p></div>`);
    return;
  }
  if (!data || data.length === 0) { notFoundView(); return; }
  const tag = data[0];
  if (!tag.claimed) { unclaimedView(code); return; }
  if (!tag.active) {
    render(`<div class="card"><p class="copy">Esta chapita está inactiva.</p></div>`);
    return;
  }
  petView(code, tag);
}
main();
</script>
</body>
</html>
