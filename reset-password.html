<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña — Huella SOS</title>
<style>
  :root {
    --primary: #0D2B4E;
    --secondary: #F4A261;
    --coral: #FF6F61;
    --accent: #7FB069;
    --cream: #FAF3E7;
    --card: #FFFBF4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2A2A2A;
    background: var(--cream);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--card);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 8px 32px rgba(13, 43, 78, 0.08);
  }
  .icon-circle {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(13, 43, 78, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  h1 {
    color: var(--primary);
    font-size: 22px;
    margin: 0 0 8px;
    text-align: center;
  }
  .subtitle {
    color: #555;
    text-align: center;
    margin: 0 0 24px;
    font-size: 13px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    margin: 12px 0 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--primary); }
  .btn {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 16px;
    box-shadow: 0 4px 12px rgba(13, 43, 78, 0.2);
  }
  .btn:disabled {
    background: #aaa;
    cursor: not-allowed;
    box-shadow: none;
  }
  .status {
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    margin-top: 16px;
    text-align: center;
  }
  .status.ok {
    background: rgba(127, 176, 105, 0.15);
    color: #4a7a3e;
  }
  .status.err {
    background: rgba(255, 111, 97, 0.15);
    color: #b34a40;
  }
  .hint {
    font-size: 11px;
    color: #888;
    margin-top: 8px;
  }
  .footer {
    text-align: center;
    padding: 16px;
    color: #999;
    font-size: 11px;
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon-circle">🔑</div>
  <h1>Restablecer contraseña</h1>
  <p class="subtitle">Elige una nueva contraseña para tu cuenta de Huella SOS.</p>

  <div id="form-block">
    <label for="pwd1">Nueva contraseña</label>
    <input type="password" id="pwd1" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
    <p class="hint">Mínimo 6 caracteres.</p>

    <label for="pwd2">Repetir contraseña</label>
    <input type="password" id="pwd2" autocomplete="new-password" placeholder="Repite la contraseña">

    <button class="btn" id="submitBtn" onclick="updatePassword()">Cambiar contraseña</button>
    <div id="status"></div>
  </div>

  <div id="success-block" style="display:none">
    <div class="status ok">
      ✓ ¡Listo! Tu contraseña fue actualizada.<br>
      Ahora puedes volver a la app y entrar con la nueva contraseña.
    </div>
    <a href="io.supabase.huellasos://login-callback"
       style="display:block;text-align:center;margin-top:16px;padding:14px;background:var(--primary);color:white;text-decoration:none;border-radius:14px;font-weight:700">
      Abrir Huella SOS
    </a>
  </div>

  <div class="footer">© 2026 Huella SOS — Hecho con cariño 🐾</div>
</div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ⚠️ Reemplazar con tus valores reales
const SUPABASE_URL  = 'https://jerzykqzcjszynkfkwpk.supabase.co';
const SUPABASE_ANON = 'sb_publishable_THk6vXVu7oOuoZVMasChBw_5qYHXHrB';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const statusEl = document.getElementById('status');

function showStatus(msg, kind) {
  statusEl.innerHTML = `<div class="status ${kind}">${msg}</div>`;
}

async function updatePassword() {
  const p1 = document.getElementById('pwd1').value;
  const p2 = document.getElementById('pwd2').value;
  const btn = document.getElementById('submitBtn');

  if (p1.length < 6) {
    showStatus('La contraseña debe tener al menos 6 caracteres.', 'err');
    return;
  }
  if (p1 !== p2) {
    showStatus('Las contraseñas no coinciden.', 'err');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Actualizando…';
  statusEl.innerHTML = '';

  const { error } = await sb.auth.updateUser({ password: p1 });

  if (error) {
    showStatus('No se pudo actualizar: ' + error.message + '. Vuelve a solicitar el reset desde la app.', 'err');
    btn.disabled = false;
    btn.textContent = 'Cambiar contraseña';
    return;
  }

  // Éxito — mostrar bloque de confirmación
  document.getElementById('form-block').style.display = 'none';
  document.getElementById('success-block').style.display = 'block';
}

// Al cargar la página: si no hay sesión activa (porque venimos del email
// reset), Supabase JS la crea automáticamente leyendo el token del hash
// de la URL. Validamos que haya una sesión recuperada.
(async () => {
  // Da un segundo para que Supabase procese el hash de la URL
  await new Promise(r => setTimeout(r, 300));
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    showStatus(
      'Este enlace no es válido o ya fue usado. Vuelve a solicitar el reset desde la app.',
      'err'
    );
    document.getElementById('submitBtn').disabled = true;
  }
})();
</script>

</body>
</html>
